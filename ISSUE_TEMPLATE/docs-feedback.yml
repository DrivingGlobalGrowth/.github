name: Docs feedback
description: Something in our documentation was confusing, missing, outdated, or wrong
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: Link to the file (or paste the file name / section heading)
      placeholder: https://github.com/DrivingGlobalGrowth/reference-materials/blob/main/...
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: What kind of issue?
      options:
        - Confusing / hard to follow
        - Missing information
        - Outdated / no longer true
        - Wrong / broken (link, command, step)
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What were you trying to do, and where did you get stuck?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion (optional)
      description: How would you reword or fix it? A rough idea is fine.
  - type: dropdown
    id: impact
    attributes:
      label: How much did it block you?
      options:
        - Minor, I figured it out
        - Slowed me down
        - Blocked me / I needed help
